[project]
name = "pre-datasets"
version = "0.1.0"
description = "From original data to ready-to-use datasets on Hugging Face."
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Paxon Lee", email = "paxonlee@startown.ai" }]
dependencies = [
    "datasets>=5.1.0",
    "huggingface-hub>=2.4.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
